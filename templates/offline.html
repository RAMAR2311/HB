<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin Conexión - HARRY BEER STATION</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-color: #F7F4EB;
            color: #121214;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            text-align: center;
        }
        .offline-icon {
            font-size: 5rem;
            color: #D92524;
            margin-bottom: 1rem;
        }
        h1 { font-family: 'Montserrat', sans-serif; font-weight: 800; }
        .btn-retry {
            background-color: #121214;
            color: #FFFFFF;
            border-radius: 12px;
            padding: 10px 24px;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <i class="fa-solid fa-wifi-slash offline-icon"></i>
        <h1>Sin Conexión a Internet</h1>
        <p class="text-muted mb-4">Parece que te has desconectado de la red.<br>Revisa tu conexión Wi-Fi o datos móviles e intenta de nuevo.</p>
        <button onclick="window.location.reload()" class="btn btn-retry"><i class="fa-solid fa-rotate-right me-2"></i> Reintentar</button>
    </div>
</body>
</html>
